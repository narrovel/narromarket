name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: python -m pip install -r requirements.txt
      - run: python -m pip install ruff==0.16.5
      - run: python -m pip check
      - run: ruff check .
      - run: python -m compileall -q bot.py config.py db handlers services tools utils

      # Every tool runs against a temporary database and needs no network and no secrets.
      - run: python -m tools.selfcheck
      - run: python -m tools.walkthrough
      - run: python -m tools.edgecases
      - run: python -m tools.loadcheck

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements-dev.txt
      - run: bandit -q -r bot.py config.py db handlers services utils -s B608
      - run: pip-audit -r requirements.txt
